extends: default.yaml

# TUAB v3.0.1 recording-level normal/abnormal classification.
# Match default.yaml's large-disk paths; keep result output separate.
paths:
  data_root: "/root/autodl-tmp/data/v3.0.1"
  cache_dir: "/root/autodl-tmp/cache"
  results_dir: "results_tuab_phase001"

dataset:
  active: "tuab"

wiener:
  mode: phasegated
  phase_gate_threshold_rad: 0.01
  coherent_gate_enabled: false

# Script 19: independent raw/specific/coherent EEGNet models on Script 18
# recording caches. Validation recording AUPRC selects the checkpoint;
# validation recording balanced accuracy selects the frozen threshold.
ml:
  tuab_component_eegnet:
    random_state: 42
    device: auto
    num_workers: 0
    F1: 8
    D: 2
    dropout: 0.25
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 64
    records_per_step: 4
    max_epochs: 200
    patience: 20
    lr_patience: 10
    lr_factor: 0.5
    early_stopping_metric: validation_recording_auprc
    threshold_selection: validation_recording_balanced_accuracy
