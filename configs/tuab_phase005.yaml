extends: default.yaml

# TUAB v3.0.1 recording-level normal/abnormal classification.
# Match default.yaml's large-disk paths; keep result output separate.
paths:
  data_root: "/root/autodl-tmp/data/v3.0.1"
  cache_dir: "/root/autodl-tmp/cache"
  results_dir: "results/results_tuab_phase005"

dataset:
  active: "tuab"

channels:
  channel_groups:
    - [FP1, FP2, F3, F4, F7, F8, FZ]
    - [F3, T3, T5, C3, CZ]
    - [F4, T4, T6, C4]
    - [P3, P4, PZ, O1, O2]

wiener:
  mode: phasegated
  phase_gate_threshold_rad: 0.05
  coherent_gate_enabled: false

# Script 19: independent raw/specific/coherent/specific_coherent EEGNet models
# on Script 18 caches. specific_coherent concatenates both 19-channel banks.
# Validation recording AUPRC selects the checkpoint;
# validation recording balanced accuracy selects the frozen threshold.
ml:
  tuab_component_eegnet:
    random_state: 42
    device: auto
    num_workers: 0
    F1: 8
    D: 2
    dropout: 0.25
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 64
    records_per_step: 4
    max_epochs: 200
    patience: 20
    lr_patience: 10
    lr_factor: 0.5
    early_stopping_metric: validation_recording_auprc
    threshold_selection: validation_recording_balanced_accuracy
