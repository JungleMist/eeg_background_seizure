paths:
  data_root: "D:/EEGdata/TUEP/v3.1.0"
  cache_dir: "cache"
  results_dir: "results"

dataset:
  reference_scheme: "ar"
  montage_dir: "01_tcp_ar"
  classes:
    epilepsy: "00_epilepsy"
    control: "01_no_epilepsy"

split:
  train: 0.70
  val: 0.10
  test: 0.20
  random_seed: 42

preprocessing:
  target_sfreq: 125
  bandpass: [0.5, 40.0]
  epoch_length_sec: 8.0
  artifact_threshold_uv: 200.0
  seizure_buffer_sec: 30.0

channels:
  standard_19:
    - FP1
    - FP2
    - F3
    - F4
    - F7
    - F8
    - C3
    - C4
    - T3
    - T4
    - T5
    - T6
    - P3
    - P4
    - O1
    - O2
    - Fz
    - Cz
    - Pz
  channel_groups:                       # G1–G6 movement-artifact conduction paths
    - [FP1, FP2]                        # G1 – symmetric facial (frontalis)
    - [F7, T3]                          # G2 – left SCM
    - [T3, T5, O1]                      # G3 – left posterior neck (3-ch chain)
    - [O1, O2]                          # G4 – bilateral occipitalis
    - [F8, T4]                          # G5 – right SCM
    - [T4, T6, O2]                      # G6 – right posterior neck (3-ch chain)
  passthrough: [F3, F4, C3, C4, P3, P4, Fz, Cz, Pz]

wiener:
  mode: "frequency"
  nperseg: 250
  freq_resolution_hz: 0.5
  coherence_threshold: 0.15
  freq_band: [0.5, 40.0]

ica:
  n_components: 19
  method: "fastica"
  artifact_corr_threshold: 0.8
  random_state: 42

verification:
  v2_transitivity_amp_threshold: 0.1
  v2_transitivity_phase_threshold: 0.392
  v3_freq_variation_threshold: 0.20

visualization:
  psd_target_channels: ["FP1", "FP2"]

ml:
  xgboost:
    param_grid:
      max_depth: [3, 4, 5, 6]
      learning_rate: [0.05, 0.1, 0.3]
      n_estimators: [100, 200, 500]
      subsample: [0.8, 1.0]
      colsample_bytree: [0.8, 1.0]
      reg_alpha: [0.0, 0.1]
      reg_lambda: [1.0, 5.0]
    fixed:
      objective: "binary:logistic"
      eval_metric: "auc"
      random_state: 42
      n_jobs: -1
      device: "cuda"
    early_stopping_rounds: 30
    cv_folds: 5
  shap:
    max_display: 20
    dpi: 150
