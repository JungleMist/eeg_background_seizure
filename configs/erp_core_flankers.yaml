extends: default.yaml

# Standalone ERP-CORE Flankers benchmark (script 10).  The Wiener numerical
# defaults are inherited from default.yaml; only dataset-specific sampling,
# passband, and channel-name mappings are changed here.
paths:
  results_dir: results/erp_core_flankers

preprocessing:
  target_sfreq: 125
  bandpass: [0.1, 30.0]
  epoch_length_sec: 20.0
  artifact_threshold_uv: 250.0

# ERP-CORE Wiener groups covering midline, sensorimotor, and posterior channels.
# Only EEG channels absent from every group pass through unchanged.
channels:
  channel_groups:
    - [FCz, Cz, Fz, FC3, FC4]
    - [FC3, C3, C5, P3]
    - [FC4, C4, C6, P4]
    - [P7, P8, P9, P10, PO3, PO4, PO7, PO8, O1, O2, Oz]
    - [Pz, CPz, FCz, Cz]
  passthrough: [FP1, F3, F7, FP2, F4, F8]

wiener:
  freq_band: [0.5, 30.0]

erp_core:
  data_dir: ~/Data/ERP_CORE
  line_freq: 60.0
  ern:
    tmin: -0.6
    tmax: 0.4
    baseline: [-0.4, -0.2]
    peak_window: [0.0, 0.15]
  lrp:
    tmin: -0.8
    tmax: 0.2
    baseline: [-0.8, -0.6]
    measure_window: [-0.2, 0.05]
  response_pairing_window_sec: 1.5
  standard_ica:
    n_components: 15
    eog_proxy_channels: [FP1, FP2]
    random_state: 42
    max_iter: 1000
  classification:
    cv_folds: 5
    tmin: -0.2
    tmax: 0.2
    decim: 4
    random_state: 42
  phase_search:
    output_dir: results/erp_core_ern_phase_search
    cache_subdir: erp_core_ern_phase_search
    metric: auroc
    test_size: 0.2
    cv_folds: 5
    random_state: 42
    phase_start: 0.0
    phase_stop: 3.141592653589793
    phase_step: 0.1
    random_search_iterations: 50
    device: cpu
    baseline_xgboost:
      max_depth: 4
      learning_rate: 0.05
      n_estimators: 200
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
  visualization:
    segment_start_sec: 60.0
    segment_duration_sec: 10.0
