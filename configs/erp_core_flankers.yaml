extends: default.yaml

# Standalone ERP-CORE Flankers benchmark (script 10).  The Wiener numerical
# defaults are inherited from default.yaml; only dataset-specific sampling,
# passband, and channel-name mappings are changed here.
paths:
  results_dir: results/erp_core_flankers

preprocessing:
  target_sfreq: 125
  bandpass: [0.1, 30.0]
  epoch_length_sec: 20.0
  artifact_threshold_uv: 250.0

# ERP-CORE ERN-focused Wiener group.  All remaining EEG channels pass through
# unchanged so the only decomposed targets are FCz/Cz/Fz/FC3/FC4.
channels:
  channel_groups:
    - [FCz, Cz, Fz, FC3, FC4]
  passthrough: [FP1, F3, F7, C3, C5, P3, P7, P9, PO7, PO3, O1, Oz,
                Pz, CPz, FP2, F4, F8, C4, C6, P4, P8, P10, PO8, PO4, O2]

wiener:
  freq_band: [0.5, 30.0]

erp_core:
  line_freq: 50.0
  ern:
    tmin: -0.6
    tmax: 0.4
    baseline: [-0.4, -0.2]
    peak_window: [0.0, 0.15]
  lrp:
    tmin: -0.8
    tmax: 0.2
    baseline: [-0.8, -0.6]
    measure_window: [-0.2, 0.05]
  response_pairing_window_sec: 1.5
  standard_ica:
    n_components: 15
    eog_proxy_channels: [FP1, FP2]
    random_state: 42
    max_iter: 1000
  classification:
    cv_folds: 5
    tmin: -0.2
    tmax: 0.2
    decim: 4
    random_state: 42
  visualization:
    segment_start_sec: 60.0
    segment_duration_sec: 10.0
