# exp_chgroups_4.yaml — Channel-group ablation: Current default (G1–G6)
# Experiment: replicates configs/default.yaml channel groups exactly.
# Used as the baseline in the channel-group comparison experiment.
#
# Run pipeline:
#   conda run -n eeg_pipeline python scripts/01_extract_epochs.py --config configs/exp_chgroups_4.yaml --workers 1
#   conda run -n eeg_pipeline python scripts/02_run_wiener.py     --config configs/exp_chgroups_4.yaml --force --workers 1
#   conda run -n eeg_pipeline python scripts/04_run_verification.py --config configs/exp_chgroups_4.yaml --workers 1
#   conda run -n eeg_pipeline python scripts/06_train_xgboost.py  --config configs/exp_chgroups_4.yaml --condition wiener --force --workers 1
#   conda run -n eeg_pipeline python scripts/07_organize_experiment.py --config configs/exp_chgroups_4.yaml --name chgroups-4-default-g1-g6

paths:
  data_root: "/root/autodl-tmp/EEGdata/TUEP/v3.1.0"
  cache_dir: "/root/autodl-tmp/cache"
  results_dir: "results/exp_chgroups/4"

dataset:
  reference_scheme: "ar"
  montage_dir: "01_tcp_ar"
  classes:
    epilepsy: "00_epilepsy"
    control: "01_no_epilepsy"

split:
  train: 0.70
  val:   0.10
  test:  0.20
  random_seed: 42

preprocessing:
  target_sfreq: 125
  bandpass: [0.5, 40.0]
  epoch_length_sec: 8.0
  artifact_threshold_uv: 200.0
  seizure_buffer_sec: 30.0

channels:
  standard_19:
    - FP1
    - FP2
    - F3
    - F4
    - F7
    - F8
    - C3
    - C4
    - T3
    - T4
    - T5
    - T6
    - P3
    - P4
    - O1
    - O2
    - Fz
    - Cz
    - Pz
  # Default G1–G6: movement-artifact conduction pathways (same as default.yaml).
  # Note: T3 appears in G2+G3; O1 in G3+G4; T4 in G5+G6; O2 in G4+G6.
  # When a channel is in multiple groups the last group processed wins.
  # Coverage: 10 unique grouped + 9 passthrough = 19 ✓
  channel_groups:
    - [FP1, FP2]              # G1 – symmetric facial (frontalis)
    - [F7, T3]                # G2 – left SCM
    - [T3, T5, O1]            # G3 – left posterior neck (3-ch chain)
    - [O1, O2]                # G4 – bilateral occipitalis
    - [F8, T4]                # G5 – right SCM
    - [T4, T6, O2]            # G6 – right posterior neck (3-ch chain)
  passthrough: [F3, F4, C3, C4, P3, P4, Fz, Cz, Pz]

wiener:
  mode: "frequency"
  nperseg: 250
  freq_resolution_hz: 0.5
  coherence_threshold: 0.15
  filter_magnitude_threshold: 50.0
  freq_band: [0.5, 40.0]

ica:
  n_components: 19
  method: "fastica"
  artifact_corr_threshold: 0.8
  random_state: 42
  max_iter: 1000

verification:
  v2_transitivity_amp_threshold: 0.1
  v2_transitivity_phase_threshold: 0.392
  v3_freq_variation_threshold: 0.20

visualization:
  psd_target_channels: ["FP1", "FP2"]
  n_subjects: 4
  epoch_idx: 1

ml:
  xgboost:
    param_grid:
      max_depth: [4, 6]
      learning_rate: [0.05, 0.1]
      subsample: [0.8]
      colsample_bytree: [0.8]
      reg_alpha: [0.0]
      reg_lambda: [1.0]
    fixed:
      objective: "binary:logistic"
      eval_metric: "auc"
      random_state: 42
      n_jobs: -1
      device: "cuda"
    early_stopping_rounds: 30
    cv_folds: 3
  shap:
    max_display: 20
    dpi: 150
    pruning_threshold: 1.0e-4
  features:
    wavelet:
      wavelet: db4
      level: 6
    connectivity:
      nperseg: 250
    complexity:
      m: 2
      r_factor: 0.2
    temporal:
      scales: [125, 375, 750]
  cnn:
    F1: 8
    D: 2
    dropout: 0.25
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 64
    max_epochs: 200
    patience: 20
    lr_patience: 10
    lr_factor: 0.5
    device: "cuda"
    num_workers: 0
